name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Node.js 24 ─────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ─── 3. Java 21 ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─── 4. Android SDK ────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ─── 5. Copy web files into www folder ─────────────────────────
      - name: Prepare web directory
        run: |
          mkdir -p www
          cp -r *.html *.css *.js *.png *.json sw.js dist www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true
          ls www/

      # ─── 6. Install Capacitor ──────────────────────────────────────
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-package-lock

      # ─── 7. Init Capacitor with www as web dir ──────────────────────
      - name: Init Capacitor
        run: npx cap init "SarimBiz" "com.sarim.biz" --web-dir www

      # ─── 8. Add Android platform ───────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      # ─── 9. Sync Capacitor ─────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ─── 10. Bump versionCode ──────────────────────────────────────
      - name: Bump versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      # ─── 11. Grant gradlew permission ──────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ─── 12. Build debug APK ───────────────────────────────────────
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # ─── 13. Find APK ──────────────────────────────────────────────
      - name: Find APK
        run: find . -name "*.apk" -type f

      # ─── 14. Upload APK ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SarimBiz-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
