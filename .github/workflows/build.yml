name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Node.js 24 ─────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ─── 3. Java 21 ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─── 4. Android SDK ────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ─── 5. Install Capacitor ──────────────────────────────────────
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-package-lock

      # ─── 6. Create capacitor.config.json ───────────────────────────
      - name: Create capacitor config
        run: |
          cat > capacitor.config.json << 'CAPEOF'
          {
            "appId": "com.sarim.biz",
            "appName": "SarimBiz",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false,
              "webContentsDebuggingEnabled": false,
              "loggingBehavior": "none",
              "backgroundColor": "#ffffff"
            },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#ffffffff"
              }
            }
          }
          CAPEOF

      # ─── 7. Copy ALL repo files into www preserving structure ───────
      - name: Prepare www folder
        run: |
          mkdir -p www
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='capacitor.config.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            . www/

      # ─── 8. Patch index.html CSP for Capacitor + Firebase ──────────
      #
      #  Your app uses:
      #   - sql.js (WASM SQLite) → needs wasm-unsafe-eval + blob:
      #   - OPFS / localStorage  → needs capacitor: scheme
      #   - Firebase Auth/Firestore → needs capacitor: in connect-src
      #   - upgrade-insecure-requests blocks capacitor:// internally
      #
      - name: Patch CSP and localhost for Capacitor
        run: |
          # 1. Replace default-src 'none' with permissive Capacitor default
          sed -i \
            "s|default-src 'none';|default-src 'self' capacitor: https: blob: data:;|g" \
            www/index.html

          # 2. Add capacitor: and blob: to script-src (WASM needs blob:)
          sed -i \
            "s|script-src  'self' 'unsafe-inline' 'wasm-unsafe-eval'|script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' capacitor: https: blob:|g" \
            www/index.html

          # 3. Add capacitor: to style-src
          sed -i \
            "s|style-src   'self' 'unsafe-inline'|style-src 'self' 'unsafe-inline' capacitor: https:|g" \
            www/index.html

          # 4. Add capacitor: and blob: to img-src
          sed -i \
            "s|img-src     'self' data:|img-src 'self' data: capacitor: https: blob:|g" \
            www/index.html

          # 5. Add capacitor: to connect-src (Firebase + OPFS calls)
          sed -i \
            "s|connect-src 'self'|connect-src 'self' capacitor: https: wss: blob:|g" \
            www/index.html

          # 6. Add blob: to worker-src (sql-wasm.js worker)
          sed -i \
            "s|worker-src  'self';|worker-src 'self' blob:;|g" \
            www/index.html

          # 7. Remove upgrade-insecure-requests — breaks capacitor:// scheme
          sed -i \
            "s|upgrade-insecure-requests;||g" \
            www/index.html

          # 8. Add manifest-src for capacitor
          sed -i \
            "s|manifest-src 'self';|manifest-src 'self' capacitor:;|g" \
            www/index.html

          echo "--- Patched CSP ---"
          grep -A 40 "Content-Security-Policy" www/index.html | head -45

      # ─── 9. Restore original Firebase config + place google-services.json ──
      - name: Patch Firebase config and add google-services.json
        run: |
          # ── A. Restore original Firebase JS config in all JS files ──
          python3 - << 'FBEOF'
import re, os

files = [
    "www/utilities-sales.js",
    "www/sync.js",
    "www/business.js",
]

# Original config restored as-is from the repo
new_config = """const firebaseConfig = {
  apiKey: "AIzaSyDYjGQILtrcG2nfKACSfsVtfIPZOAgbr_s",
  authDomain: "calculator-fabd3.firebaseapp.com",
  databaseURL: "https://calculator-fabd3-default-rtdb.firebaseio.com",
  projectId: "calculator-fabd3",
  storageBucket: "calculator-fabd3.firebasestorage.app",
  messagingSenderId: "124313576124",
  appId: "1:124313576124:web:fb721bb61bc19b51db26b9",
  measurementId: "G-G45Y5KL4EJ"
};"""

pattern = re.compile(r'const firebaseConfig\s*=\s*\{[^}]*\}', re.DOTALL)

for path in files:
    if not os.path.exists(path):
        print(f"Skipping {path}")
        continue
    with open(path) as f:
        src = f.read()
    updated = pattern.sub(new_config, src)
    if updated != src:
        with open(path, "w") as f:
            f.write(updated)
        print(f"Patched: {path}")
    else:
        print(f"No match: {path}")
FBEOF

          # ── B. Write google-services.json for Android native SDK ───
          cat > android/app/google-services.json << 'GSEOF'
{
  "project_info": {
    "project_number": "124313576124",
    "firebase_url": "https://calculator-fabd3-default-rtdb.firebaseio.com",
    "project_id": "calculator-fabd3",
    "storage_bucket": "calculator-fabd3.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:124313576124:android:c2413be54359acd4db26b9",
        "android_client_info": {
          "package_name": "com.sarim.dealersapp"
        }
      },
      "oauth_client": [
        {
          "client_id": "124313576124-408rl178jlpua4qgcb25lb85hbautsda.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyAE03wJlYxe4jhai62IXNkH79hkvTZH0nE"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "124313576124-408rl178jlpua4qgcb25lb85hbautsda.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
GSEOF
          echo "--- google-services.json written ---"
          cat android/app/google-services.json

          # ── C. Update app package name to match google-services.json ─
          sed -i 's/com\.sarim\.biz/com.sarim.dealersapp/g' \
            android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId "com\.sarim\.biz"/applicationId "com.sarim.dealersapp"/g' \
            android/app/build.gradle
          echo "--- Package name updated to com.sarim.dealersapp ---"

          # ── D. Add Google Services plugin to build.gradle ───────────
          # App-level: apply plugin
          grep -q "google-services" android/app/build.gradle || \
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

          # Project-level: add classpath
          grep -q "google-services" android/build.gradle || \
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" \
            android/build.gradle

          echo "--- Google Services plugin added ---"

      # ─── 10. Add Android platform ──────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      # ─── 11. Sync Capacitor ────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ─── 12a. Disable edge-to-edge (app sits below status bar) ────
      - name: Disable edge-to-edge display
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"

          # Write a clean styles.xml that disables edge-to-edge completely
          cat > "$STYLES" << 'STYLESEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
        <item name="android:background">@android:color/white</item>
        <item name="android:statusBarColor">@android:color/white</item>
        <item name="android:windowTranslucentStatus">false</item>
        <item name="android:windowDrawsSystemBarBackgrounds">true</item>
        <item name="android:fitsSystemWindows">true</item>
        <item name="android:windowLightStatusBar">true</item>
    </style>
</resources>
STYLESEOF

          # Also fix values-v21 if it exists
          mkdir -p android/app/src/main/res/values-v21
          cat > android/app/src/main/res/values-v21/styles.xml << 'STYLESV21EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
        <item name="android:background">@android:color/white</item>
        <item name="android:statusBarColor">@android:color/white</item>
        <item name="android:windowTranslucentStatus">false</item>
        <item name="android:windowDrawsSystemBarBackgrounds">true</item>
        <item name="android:fitsSystemWindows">true</item>
        <item name="android:windowLightStatusBar">true</item>
    </style>
</resources>
STYLESV21EOF

          # Patch AndroidManifest to use AppTheme and fitsSystemWindows
          sed -i 's/android:theme="@style\/AppTheme"/android:theme="@style\/AppTheme" android:fitsSystemWindows="true"/' \
            android/app/src/main/AndroidManifest.xml || true

          echo "--- Edge-to-edge disabled ---"
          cat "$STYLES"

      # ─── 12. Enable large heap for SQLite WASM ─────────────────────
      - name: Patch AndroidManifest for large heap
        run: |
          sed -i 's/<application/<application android:largeHeap="true"/' \
            android/app/src/main/AndroidManifest.xml
          echo "--- AndroidManifest patched ---"
          grep "largeHeap\|application" android/app/src/main/AndroidManifest.xml | head -5

      # ─── 12b. Set launcher icons from repo PNG ─────────────────────
      - name: Generate launcher icons from 512.png
        run: |
          pip install Pillow --quiet

          python3 << 'ICONEOF'
from PIL import Image
import os

src = "www/512.png" if os.path.exists("www/512.png") else "www/192.png"
print(f"Using icon: {src}")
img = Image.open(src).convert("RGBA")

sizes = {
    "mipmap-mdpi": 48,
    "mipmap-hdpi": 72,
    "mipmap-xhdpi": 96,
    "mipmap-xxhdpi": 144,
    "mipmap-xxxhdpi": 192,
}

for folder, size in sizes.items():
    dest = f"android/app/src/main/res/{folder}"
    os.makedirs(dest, exist_ok=True)
    resized = img.resize((size, size), Image.LANCZOS)
    resized.save(f"{dest}/ic_launcher.png")
    resized.save(f"{dest}/ic_launcher_round.png")
    # Also save foreground for adaptive icons
    resized.save(f"{dest}/ic_launcher_foreground.png")
    print(f"Generated {size}x{size} -> {dest}")

print("All launcher icons generated!")
ICONEOF

      # ─── 13. Bump versionCode ──────────────────────────────────────
      - name: Bump versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      # ─── 14. Grant gradlew permission ──────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ─── 15. Build debug APK ───────────────────────────────────────
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # ─── 16. Find APK ──────────────────────────────────────────────
      - name: Find APK
        run: find . -name "*.apk" -type f

      # ─── 17. Upload APK ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SarimBiz-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
