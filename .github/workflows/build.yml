name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor and plugins
        run: |
          npm init -y
          npm install --no-package-lock @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/geolocation @capacitor/filesystem @capacitor/share @capacitor/haptics @capacitor/app

      - name: Create capacitor config
        run: >-
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({
          appId:'com.sarim.dealersapp', appName:'SarimBiz', webDir:'www',
          server:{androidScheme:'https',hostname:'localhost',cleartext:false},
          android:{allowMixedContent:false,webContentsDebuggingEnabled:false,backgroundColor:'#ffffffff'},
          plugins:{StatusBar:{overlaysWebView:false,style:'DARK',backgroundColor:'#ffffffff'},
          Camera:{presentationStyle:'fullscreen'},Geolocation:{permissions:['location']}}
          }, null, 2))"

      - name: Prepare www folder
        run: |
          mkdir -p www
          rsync -av --exclude=".git" --exclude="node_modules" --exclude="android" --exclude="www" --exclude="capacitor.config.json" --exclude="package.json" --exclude="package-lock.json" . www/

      - name: Patch CSP for Capacitor
        run: |
          sed -i "s|default-src \'none\';|default-src \'self\' capacitor: https: blob: data:;|g" www/index.html
          sed -i "s|script-src  \'self\' \'unsafe-inline\' \'wasm-unsafe-eval\'|script-src \'self\' \'unsafe-inline\' \'wasm-unsafe-eval\' capacitor: https: blob:|g" www/index.html
          sed -i "s|style-src   \'self\' \'unsafe-inline\'|style-src \'self\' \'unsafe-inline\' capacitor: https:|g" www/index.html
          sed -i "s|img-src     \'self\' data:|img-src \'self\' data: capacitor: https: blob: mediastream:|g" www/index.html
          sed -i "s|connect-src \'self\'|connect-src \'self\' capacitor: https: wss: blob:|g" www/index.html
          sed -i "s|worker-src  \'self\';|worker-src \'self\' blob:;|g" www/index.html
          sed -i "s|upgrade-insecure-requests;||g" www/index.html
          echo "CSP patched"

      - name: Inject back navigation and feature bridge
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const bridge = \`<script>
          document.addEventListener('deviceready', function() {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
              window.Capacitor.Plugins.App.addListener('backButton', function() {
                if (window.history.length > 1) { window.history.back(); }
                else { window.Capacitor.Plugins.App.exitApp(); }
              });
            }
          });
          window._triggerFileDownloadNative = async function(blob, filename) {
            try {
              if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                const reader = new FileReader();
                reader.onload = async function() {
                  const b64 = reader.result.split(',')[1];
                  const res = await window.Capacitor.Plugins.Filesystem.writeFile({ path: filename, data: b64, directory: 'DOWNLOADS', recursive: true });
                  await window.Capacitor.Plugins.Share.share({ title: 'Save Backup', url: res.uri, dialogTitle: 'Save backup file' });
                };
                reader.readAsDataURL(blob);
              } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
              }
            } catch(e) {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
            }
          };
          <\/script>\`;
          const out = html.replace('</body>', bridge + '</body>');
          fs.writeFileSync('www/index.html', out);
          console.log('Bridge injected');
          "

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Disable edge-to-edge display
        run: |
          node -e "
          const fs = require('fs');
          const xml = \`<?xml version=\'1.0\' encoding=\'utf-8\'?>
          <resources>
              <style name=\'AppTheme\' parent=\'Theme.AppCompat.Light.NoActionBar\'>
                  <item name=\'android:statusBarColor\'>@android:color/white</item>
                  <item name=\'android:windowTranslucentStatus\'>false</item>
                  <item name=\'android:windowDrawsSystemBarBackgrounds\'>true</item>
                  <item name=\'android:fitsSystemWindows\'>true</item>
                  <item name=\'android:windowLightStatusBar\'>true</item>
              </style>
          </resources>\`;
          fs.mkdirSync('android/app/src/main/res/values-v21', {recursive:true});
          fs.writeFileSync('android/app/src/main/res/values/styles.xml', xml);
          fs.writeFileSync('android/app/src/main/res/values-v21/styles.xml', xml);
          console.log('styles.xml written');
          "

      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS="    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />\n    <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />"
          sed -i "s|<application|${PERMS}\n    <application|" "$MANIFEST"
          sed -i "s|<application|<application android:largeHeap=\"true\" android:usesCleartextTraffic=\"true\"|" "$MANIFEST"
          echo "Permissions added"

      - name: Generate launcher icons
        run: |
          pip install Pillow --quiet
          echo "" | base64 -d > /tmp/gen_icons.py
          python3 /tmp/gen_icons.py

      - name: Write google-services.json
        run: >-
          node -e "require('fs').writeFileSync('android/app/google-services.json', JSON.stringify({
          project_info:{project_number:'124313576124',
          firebase_url:'https://calculator-fabd3-default-rtdb.firebaseio.com',
          project_id:'calculator-fabd3',
          storage_bucket:'calculator-fabd3.firebasestorage.app'},
          client:[{client_info:{mobilesdk_app_id:'1:124313576124:android:c2413be54359acd4db26b9',
          android_client_info:{package_name:'com.sarim.dealersapp'}},
          oauth_client:[{client_id:'124313576124-408rl178jlpua4qgcb25lb85hbautsda.apps.googleusercontent.com',client_type:3}],
          api_key:[{current_key:'AIzaSyAE03wJlYxe4jhai62IXNkH79hkvTZH0nE'}],
          services:{appinvite_service:{other_platform_oauth_client:[{
          client_id:'124313576124-408rl178jlpua4qgcb25lb85hbautsda.apps.googleusercontent.com',client_type:3}]}}}],
          configuration_version:'1'}, null, 2))"

      - name: Add Google Services Gradle plugin
        run: |
          grep -q "google-services" android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          grep -q "google-services" android/build.gradle || sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          echo "Google Services plugin added"

      - name: Bump versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SarimBiz-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
