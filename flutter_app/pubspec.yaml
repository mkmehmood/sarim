name: sarim
description: Gull & Zubair - Flutter host for the Sarim business-management web app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bridge/
    # BEGIN WEB ASSETS (generated by tools/sync_web.mjs - do not edit)
    - assets/www/
    - assets/www/fonts/
    - assets/www/vendor/
    - assets/www/vendor/firebase/
    - assets/www/vendor/leaflet/
    - assets/www/vendor/leaflet/images/
    # END WEB ASSETS
